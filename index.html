<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RelayX - AI Work Orchestration Control Plane</title>
    <meta name="description" content="Local macOS-first AI work orchestration control plane coordinating planners, workers, assignments, recovery, supervision, and observable UI automation." />
    <meta property="og:title" content="RelayX - AI Work Orchestration Control Plane" />
    <meta property="og:description" content="Local macOS-first AI work orchestration control plane coordinating planners, workers, assignments, recovery, supervision, and observable UI automation." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' http://localhost:* ws://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:*;"
    />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('relay_theme') || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
